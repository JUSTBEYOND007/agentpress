name: agentpress

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_DB: agentpress
      POSTGRES_USER: agentpress
      POSTGRES_PASSWORD: agentpress
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/local/postgres/init.sql:/docker-entrypoint-initdb.d/01-create-logto.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agentpress -d agentpress']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.10-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-16379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - '${KAFKA_PORT:-9092}:9092'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1',
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: agentpress
      MINIO_ROOT_PASSWORD: agentpress-local-secret
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  logto-init:
    image: svhd/logto:1.32.0
    depends_on:
      postgres:
        condition: service_healthy
    command:
      [
        'cli',
        '--',
        'db',
        'seed',
        '--swe',
        '--db=postgresql://agentpress:agentpress@postgres:5432/logto',
      ]
    restart: 'no'

  logto:
    image: svhd/logto:1.32.0
    depends_on:
      logto-init:
        condition: service_completed_successfully
    environment:
      DB_URL: postgresql://agentpress:agentpress@postgres:5432/logto
      DATABASE_POOL_SIZE: '5'
      DATABASE_CONNECTION_TIMEOUT: '30000'
      ENDPOINT: http://localhost:${LOGTO_PORT:-3001}
      ADMIN_ENDPOINT: http://localhost:${LOGTO_ADMIN_PORT:-3002}
      TRUST_PROXY_HEADER: '1'
    ports:
      - '${LOGTO_PORT:-3001}:3001'
      - '${LOGTO_ADMIN_PORT:-3002}:3002'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/oidc/.well-known/openid-configuration').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  kafka-data:
  minio-data:
  postgres-data:
  redis-data:
